    "C3": "trusted WanEulerScheduler / euler solver on every trajectory",
    "C4": "resume index K, resume timestep = schedule[K], final timestep = schedule[-1], executed steps = 40-K",
    "C5": "only the conditioning differs after the fork (same seed, config, checkpoint hash bound at controls time)",
    "C6": "sha256 recorded for initial latent, fork latent, final latent, final video, config, commit"
