  "claim_boundary": "One prompt pair (red->blue sports car), one model/scheduler/config, 10 seeds, 5 grid depths, blinded five-level labels by one human judge. The result bounds how much a trajectory-specific fork-depth policy could save over the best static depth for this edit; it makes no mechanism, scheduler, or end-to-end speedup claim and does not transfer to other edits."
