  "control_k": 18,
  "frame_positions": ["first", "q25", "middle", "q75", "last"],
  "blinded_review": true,
  "labels": {
    "scale": ["NEW", "MIXED_NEW_DOMINANT", "MIXED_BALANCED", "MIXED_OLD_DOMINANT", "OLD"],
    "ordinal": {"NEW": 2, "MIXED_NEW_DOMINANT": 1, "MIXED_BALANCED": 0, "MIXED_OLD_DOMINANT": -1, "OLD": -2},
    "definitions": {
      "NEW": "The target vehicle is overwhelmingly blue across the video; any red residue is negligible and does not characterize the body.",
      "MIXED_NEW_DOMINANT": "Both red and blue are clearly present on the vehicle, but blue dominates the visible body.",
      "MIXED_BALANCED": "Both red and blue are clearly present and neither visually dominates.",
      "MIXED_OLD_DOMINANT": "Both red and blue are present, but red dominates the visible body.",
      "OLD": "The target vehicle is overwhelmingly red; any blue/cyan residue is negligible and does not characterize the body."
    },
    "judging_rule": "Judge the whole video plus the five fixed frames (first, 25%, middle, 75%, last); never a favourable single frame. Labels are given blind to seed and K."
  },
  "oracle": {
    "success_labels": ["NEW", "MIXED_NEW_DOMINANT"],
    "trajectory_oracle": "K_i* := largest grid K such that every grid K' <= K succeeds (monotone cut); 0 if the smallest grid K fails. Monotonicity violations (success after a failure at smaller K) are reported descriptively and never rescue K_i*.",
    "static_oracle": "K_static(tau) := largest grid K whose success fraction over informative seeds >= tau; 0 if none.",
    "tau_primary": 1.0,
    "tau_descriptive": 0.9,
    "gap": "G := mean_i (K_i* - K_static(1.0)) / 40 (fraction of a full 40-step generation)",
    "descriptive_only": [
      "relative gap mean(K_i* - K_static) / (40 - K_static)",
      "fraction of seeds with K_i* > K_static",
      "tau = 0.9 K_static and gap",
      "K_i* distribution and per-seed label sequences",
      "leave-out-earliest-committing-seed gap",
      "monotonicity violation count",
      "CLIP new_minus_old, SSIM (uncalibrated)"
    ]
  },
  "gate": {
    "probe_pair_cost_fraction": 0.09,
    "probe_pair_cost_source": "Round 4A results/video_trajectory_fork_probe_killtest/summary.json: OLD+NEW one-step probe pair wall ~21 s vs 237-278 s full generation (0.08-0.09)",
    "no_go_max_gap": 0.09,
    "go_min_gap": 0.15,
    "min_informative_seeds": 8,
    "decision_order": "INVALID (fewer than 8 informative seeds, or C1 spot exactness fails) > NO-GO (G <= 0.09) > GO (G >= 0.15) > WEAK (0.09 < G < 0.15)",
    "rationale": "If the best trajectory-specific policy saves at most the cost of measuring the trajectory (one probe pair), trajectory information cannot pay for itself for this edit; the 0.15 GO bar requires the saving to clearly exceed that cost."
