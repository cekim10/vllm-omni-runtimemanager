  "probe": {
    "definition": "from the persisted OLD checkpoint x_k, execute exactly one trusted Euler step under OLD conditioning and, from the identical persisted x_k, one under NEW conditioning; the response is the CFG-combined noise prediction consumed by the scheduler",
    "response_boundary": "guidance_combined_output",
    "update_boundary": "scheduler_output",
    "input_boundary": "latent_entering_step",
    "execution_step_limit": 1,
    "skip_vae_decode": true,
    "primary_signal": "relative_response_l2",
    "formula": "||p_new - p_old||_2 / (||p_old||_2 + eps)",
    "eps": 1e-12,
    "direction": "higher_probe_means_more_forkable",
    "direction_note": "frozen; an opposite observed direction is a failure of the primary probe, never flipped post hoc"
  },
  "secondary_signals": [
    "response_delta_rms",
    "response_cosine",
    "differing_element_fraction",
    "relative_step_effect (||x_next_new - x_next_old|| / (||x_k|| + eps) using the trusted scheduler output)",
    "delta_over_response_rms",
    "rho_all",
    "rho_without_k25",
    "timestep_only_rho = Spearman(-k, ordinal)",
    "probe_vs_timestep_rho = Spearman(k, probe)"
  ],
  "gate": {
    "primary_k": 15,
    "low_forkability_seed": 2345,
    "high_forkability_seeds": [
      3456,
      4567
