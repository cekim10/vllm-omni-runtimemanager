    "confounded_k": 25,
    "k15_gap_over_repeat_noise_min_ratio": 10.0,
    "k15_gap_abs_floor": 1e-06
  },
  "determinism_audit": {
    "point": [
      3456,
      15
    ],
    "repeat": "both OLD and NEW responses once",
    "tolerance": 0.0,
    "note": "the trusted Euler path is bit-exact deterministic on this host; any difference is INVALID"
  },
  "decision_rule": {
    "INVALID": "any hard control fails: checkpoint/input binding, prompt, model/scheduler/config, execution boundary timestep, one-step semantics, determinism audit, missing rows, non-finite artifacts",
    "NO-GO": "SAME_K_PRIMARY_PASS false; no sign flip, no metric switch, no added probes/seeds, no rescue via global correlation",
    "WEAK-PASS": "SAME_K_PRIMARY_PASS true but k20 support fails, or k15 gaps not material (min gap <= max(10 x repeat |diff|, 1e-6)), or rho_all <= 0, or rho_without_k25 <= 0",
    "PROMISING": "SAME_K_PRIMARY_PASS and SAME_K20_SUPPORT and determinism pass and material k15 gaps and rho_all > 0 and rho_without_k25 > 0"
