  "expected_local_responses": 26,
  "claim_boundary": "Allowed at most: 'In this previously frozen three-seed red-to-blue dataset, a cheap local OLD-vs-NEW response probe distinguished trajectory-specific downstream forkability at the same denoising timestep.' No predictor, threshold, cross-prompt/edit/model, serving, NIRVANA-comparison, or optimal-rollback claim."
